<main class="min-h-screen flex items-center justify-center relative p-xl">

<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#001b3d 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-[520px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Branding Section -->
<div class="text-center mb-2xl">
<div class="inline-flex items-center justify-center mb-md">
<span class="font-display-lg text-display-lg font-extrabold tracking-tighter text-primary-container">

                    </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                    The elite management platform for peak athletic performance.
                </p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-[32px] p-xl deep-shadow relative overflow-hidden">
<!-- Integrated Security Illustration -->
<div class="absolute -top-6 -right-6 w-32 h-32 opacity-[0.03] pointer-events-none">

</div>
<div class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 mb-md">
<img alt="Security Shield" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLulY1wAwjsMYA5Z8dGPn6jtNfBNKxUOj8KmioRSgDmBPVm_gn9FopCQVzO2cRMvmXH0C0zD7qs9WGqpvfqEqAfDQmTt1bHvgg5XvtrjueVaQrzjjF6k5nWAZIO8biDF2ng7ynUVAvKEzqM5dtCGt99_qRPiS_hxhT31eizE5LaZdHxd_y9XVMBcYPt8rKYaAXWOw7KNutL1Hx_TmysGjBFp1RnI1uHEbZ7q9A7mdedEuQFSUEkErjzRQjo">
</div>
<h2 class="font-headline-md text-headline-md text-primary-container">Secure Access</h2>
</div>
<form class="space-y-xl" onsubmit="event.preventDefault()">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-lg top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors">mail</span>
<input class="w-full pl-[56px] pr-lg py-xl bg-surface border border-outline-variant/50 rounded-xl font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="email" placeholder="coach@pro-team.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-fixed-dim transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-lg top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors">lock</span>
<input class="w-full pl-[56px] pr-lg py-xl bg-surface border border-outline-variant/50 rounded-xl font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Login Button -->

                        Sign In
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative py-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-label-md">
<span class="bg-surface-container-lowest px-md text-on-surface-variant font-label-md">OR CONTINUE WITH</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-lg">
<button class="flex items-center justify-center gap-sm border border-outline-variant/50 bg-surface-container-low py-lg rounded-xl font-body-md text-body-md hover:bg-surface-container-high transition-colors active:scale-95">

                            Google
                        </button>
<button class="flex items-center justify-center gap-sm border border-outline-variant/50 bg-surface-container-low py-lg rounded-xl font-body-md text-body-md hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-[20px] text-primary-container" style="font-variation-settings: 'FILL' 1;">apps</span>
                            Apple
                        </button>
</div>
</form>
<!-- Signup Prompt -->
<div class="mt-2xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary-container font-bold hover:text-secondary transition-colors" href="#">Request Access</a>
</p>
</div>
</div>
<!-- Footer Stats -->
<div class="mt-2xl flex justify-between items-center px-lg border-t border-outline-variant/20 pt-xl">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-outline uppercase">Uptime</span>
<span class="font-headline-sm text-headline-sm text-primary-container">99.9%</span>
</div>
<div class="flex flex-col text-right">
<span class="font-label-md text-label-md text-outline uppercase">Secure Nodes</span>
<span class="font-headline-sm text-headline-sm text-primary-container">2.4k</span>
</div>
</div>
</div>
</main>
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.group').classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.closest('.group').classList.remove('scale-[1.01]');
            });
        });

        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Authenticating...';
            this.classList.add('pointer-events-none', 'opacity-80');
            
            setTimeout(() => {
                this.innerHTML = originalText;
                this.classList.remove('pointer-events-none', 'opacity-80');
            }, 1500);
        });
    </script>
</body></html>
