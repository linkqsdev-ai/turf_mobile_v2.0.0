<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign Up | SPORTS OS</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background-color: #f7f9fb;
            background-image: radial-gradient(at 0% 0%, rgba(255, 199, 3, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, rgba(0, 27, 61, 0.03) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        input:focus {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eceef0",
                        "inverse-primary": "#b1c7f2",
                        "outline": "#74777f",
                        "on-primary-fixed": "#001b3d",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#75859d",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#6e5400",
                        "background": "#f7f9fb",
                        "tertiary-fixed": "#d3e4fe",
                        "error": "#ba1a1a",
                        "surface-dim": "#d8dadc",
                        "secondary-container": "#ffc703",
                        "primary-fixed-dim": "#b1c7f2",
                        "outline-variant": "#c4c6cf",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-secondary-fixed": "#251a00",
                        "surface-tint": "#495f84",
                        "on-error": "#ffffff",
                        "secondary": "#765b00",
                        "inverse-on-surface": "#eff1f3",
                        "surface-variant": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "inverse-surface": "#2d3133",
                        "surface-container-high": "#e6e8ea",
                        "secondary-fixed": "#ffdf94",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "on-secondary-fixed-variant": "#594400",
                        "tertiary-container": "#0b1c30",
                        "on-background": "#191c1e",
                        "on-surface-variant": "#44474e",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-primary-fixed-variant": "#31476b",
                        "on-primary-container": "#6f84ac",
                        "primary": "#000000",
                        "primary-fixed": "#d6e3ff",
                        "primary-container": "#001b3d",
                        "surface-container-highest": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "secondary-fixed-dim": "#f5bf00",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "panel": "32px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "gutter": "24px",
                        "margin": "32px",
                        "lg": "24px",
                        "2xl": "64px",
                        "base": "4px",
                        "xl": "40px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "body-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-mesh min-h-screen flex flex-col font-body-md text-on-surface selection:bg-secondary-container">
<!-- Auth Shell Excludes Navigation per UX Goal -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter py-2xl relative overflow-hidden">
<!-- Faint Athlete Silhouette Background -->
<div class="absolute top-0 right-0 w-full md:w-1/2 h-full opacity-[0.03] pointer-events-none transition-opacity duration-1000" id="hero-silhouette">
<img alt="Athlete Backdrop" class="w-full h-full object-cover object-right-top" src="https://lh3.googleusercontent.com/aida/AP1WRLsrliF0Cd3A1noW1I-8QmrA86jnUIhi367jWWnWwX_4cOBZvy0pEfT2NOP469vVIgcettV0_tGsG8CLAVsU4gpyVZYJY30Ms2S9po_TAFCHtuZGlN0TfD6UKPJL-W4zBAou4QiM6fwBAoQ70des2-UtAfllHZdyG7TSX_arZ0Gj7rIEGoIjW_lyUG2y-nnju08P3-ZpQxYURos2c2MwDDLdxzAOYHCf2_wzduUmBoMEaIV3RjBJMlYV2MM">
</div>
<div class="w-full max-w-xl z-10">
<!-- Branding & Header Section -->
<section class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter mb-sm">
                    SPORTS OS
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                    The elite operating system for high-performance athletic management.
                </p>
<!-- Benefits Row -->
<div class="flex flex-wrap justify-center gap-md mt-lg">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Advanced Metrics</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Smart Scheduling</span>
</div>
</div>
</section>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container rounded-full mb-md overflow-hidden">
<div class="w-1/3 h-full bg-primary-container transition-all duration-700 ease-out"></div>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-panel shadow-[0px_12px_48px_rgba(0,27,61,0.06)] p-xl md:p-2xl transition-all duration-300">
<div class="mb-xl">
<h2 class="font-headline-md text-headline-md text-primary mb-xs">Personal Identity</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Step 1 of 3: Establishing your professional profile.</p>
</div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Full Name Input -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs group-focus-within:text-primary transition-colors" for="fullname">
                            FULL NAME
                        </label>
<div class="relative border-b-2 border-outline-variant group-focus-within:border-primary-container transition-all py-sm">
<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg placeholder:text-outline-variant text-on-surface" id="fullname" placeholder="Enter legal name" type="text">
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container">person</span>
</div>
</div>
<!-- Email Input -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs group-focus-within:text-primary transition-colors" for="email">
                            WORK OR PERSONAL EMAIL
                        </label>
<div class="relative border-b-2 border-outline-variant group-focus-within:border-primary-container transition-all py-sm">
<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg placeholder:text-outline-variant text-on-surface" id="email" placeholder="name@organization.com" type="email">
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container">mail</span>
</div>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary-container text-on-primary-fixed font-headline-sm text-headline-sm py-md rounded-lg flex items-center justify-center gap-sm group active:scale-[0.98] transition-transform duration-100 mt-xl">
                        CONTINUE
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Already a member? 
                        <a class="font-label-md text-label-md text-primary hover:text-secondary-container transition-colors tracking-widest ml-xs" href="#">LOGIN</a>
</p>
</div>
</div>
<!-- Technical Panel Detail -->
<div class="mt-lg flex justify-between items-center px-md text-outline">
<span class="font-label-md text-[10px] tracking-widest opacity-50 uppercase">Secured by OS Protocol 2.4</span>
<span class="font-label-md text-[10px] tracking-widest opacity-50 uppercase">©2024 SPORTS OS</span>
</div>
</div>
</main>
<script>
        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Atmospheric effect: Silhouette fade in
        window.addEventListener('DOMContentLoaded', () => {
            const silhouette = document.getElementById('hero-silhouette');
            silhouette.style.opacity = '0';
            setTimeout(() => {
                silhouette.style.opacity = '0.04';
            }, 500);
        });
    </script>
</body></html>
